<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | Arlie Thompson Insurance</title>
    <link rel="icon" href="borden-logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #004a99; --secondary: #0077be; --dark: #1a1a1a; --light: #f8f9fa; --accent: #ffd700; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; line-height: 1.6; color: var(--dark); background: #ffffff; }
        header { background: #fff; padding: 10px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); }
        .logo-container { width: 132px; }
        .logo-container img { width: 100%; height: auto; display: block; }
        .page-container { max-width: 800px; margin: 0 auto; padding: 40px 6%; }
        form { background: var(--light); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; }
        .hidden-section { display: none; }
        .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; font-weight: 700; border-radius: 6px; cursor: pointer; text-align: center; display: block; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container"><img src="borden-logo.png" alt="Arlie Thompson Insurance"></div>
    </header>

    <main class="page-container">
        <h1>Request a Quote</h1>
        <form name="quote-request" method="POST" data-netlify="true">
            <label>Full Name</label>
            <input type="text" name="name" required>
            <label>Email Address</label>
            <input type="email" name="email" required>
            <label>Insurance Type</label>
            <select id="insuranceType" name="insurance-type" onchange="showFields()" required>
                <option value="">Select an option</option>
                <option value="auto">Auto</option>
                <option value="home">Home</option>
                <option value="business">Business</option>
                <option value="boat">Boat</option>
                <option value="life">Life (Contact Us)</option>
                <option value="medical">Medical (Contact Us)</option>
                <option value="tour">Tour Operations (Contact Us)</option>
            </select>

            <div id="autoFields" class="hidden-section">
                <label>Make, Model & Year</label>
                <input type="text" data-field="auto-details">
                <label>Coverage Value</label>
                <input type="number" data-field="auto-value">
            </div>

            <div id="propertyFields" class="hidden-section">
                <label>Type of Construction</label>
                <select data-field="construction-type">
                    <option>Wood</option>
                    <option>Concrete</option>
                    <option>Mixed</option>
                </select>
                <label>Building Value</label>
                <input type="number" data-field="building-value">
            </div>

            <div id="boatFields" class="hidden-section">
                <label>Boat Size</label>
                <input type="text" data-field="boat-size">
                <label>Hull Value</label>
                <input type="number" data-field="hull-value">
            </div>

            <div id="contactFields" class="hidden-section">
                <p>Please contact us via WhatsApp.</p>
                <a href="https://wa.me/50432044668" class="btn-submit">Chat on WhatsApp</a>
            </div>

            <div id="messageBox" class="hidden-section">
                <label>Additional Notes</label>
                <textarea data-field="notes" rows="4"></textarea>
                <button type="submit" class="btn-submit">Submit Request</button>
            </div>
        </form>
    </main>

    <script>
        function showFields() {
            const type = document.getElementById('insuranceType').value;
            // Hide all and clear names
            document.querySelectorAll('.hidden-section').forEach(el => {
                el.style.display = 'none';
                el.querySelectorAll('[data-field]').forEach(input => input.removeAttribute('name'));
            });

            // Show relevant
            let targetId = '';
            if (type === 'auto') targetId = 'autoFields';
            else if (type === 'home' || type === 'business') targetId = 'propertyFields';
            else if (type === 'boat') targetId = 'boatFields';
            else if (type === 'life' || type === 'medical' || type === 'tour') targetId = 'contactFields';

            if (targetId && targetId !== 'contactFields') {
                document.getElementById(targetId).style.display = 'block';
                document.getElementById('messageBox').style.display = 'block';
                document.getElementById(targetId).querySelectorAll('[data-field]').forEach(i => i.setAttribute('name', i.getAttribute('data-field')));
                document.querySelector('[data-field="notes"]').setAttribute('name', 'notes');
            } else if (targetId === 'contactFields') {
                document.getElementById('contactFields').style.display = 'block';
            }
        }
    </script>
</body>
</html>
